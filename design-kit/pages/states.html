<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빈 화면 · 불러오는 중 · 오류 · 디자인 키트 예시</title>
<link rel="stylesheet" href="../css/design.css">
</head>
<body class="k-body">
<div class="k-app" data-k-fit>
  <header class="k-head">
    <a class="k-brand" href="index.html">시험 준비</a>
    <nav class="k-nav" aria-label="사이트 메뉴">
      <span class="k-thumb" aria-hidden="true"></span>
      <a href="summary-home.html">요약</a>
      <a href="practice-list.html" aria-current="page">기출 실습</a>
      <a href="concepts.html">개념</a>
      <a href="codefind.html">코드 찾기</a>
    </nav>
    <div class="k-head-tools">
      <button type="button" class="k-tool" data-k-menu="k-view" aria-expanded="false" aria-haspopup="dialog">보기</button>
      <div class="k-pop k-pop-view" id="k-view" role="dialog" aria-label="보기 설정" hidden>
        <p class="k-cap">화면</p>
        <div class="k-seg"><span class="k-thumb" aria-hidden="true"></span><button type="button" data-k-set-theme="dark">어둡게</button><button type="button" data-k-set-theme="light">밝게</button></div>
        <p class="k-cap">글자 크기</p>
        <div class="k-seg"><span class="k-thumb" aria-hidden="true"></span><button type="button" data-k-set-size="0">작게</button><button type="button" data-k-set-size="1">보통</button><button type="button" data-k-set-size="2">크게</button></div>
      </div>
    </div>
  </header>
  <main class="k-main">
    <div class="k-top"><h1 class="k-title">빈 화면 · 불러오는 중 · 오류</h1></div>
    <div class="k-grid3">
      <section class="k-card k-state"><h2>아직 푼 문제가 없어요</h2><p>기출 실습에서 회차를 골라 첫 문제를 풀면 여기에 기록이 쌓여요.</p><a class="k-btn k-btn-primary" href="practice-list.html">기출 실습으로</a></section>
      <section class="k-card k-state k-state-loading" aria-live="polite"><span class="k-spin" aria-hidden="true"></span><h2>파이썬을 불러오는 중</h2><p>처음 한 번은 조금 걸려요.</p></section>
      <section class="k-card k-state k-state-error" role="alert"><h2>파이썬을 불러오지 못했어요</h2><p>사이트 폴더의 실행 파일이 빠졌을 수 있어요. 새로 고침한 뒤에도 같으면 관리자에게 알려 주세요.</p><button type="button" class="k-btn">다시 시도</button></section>
    </div>
  </main>
</div>
<script src="../js/design.js"></script>
</body>
</html>
